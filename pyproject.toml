[project]
name = "fal-radar"
version = "0.1.0"
description = "Collector for fal radar: public GitHub projects built on fal, mapped weekly. Unofficial, not affiliated with fal."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Arda Noyan Karasoglu" }]
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "typer==0.27.2",
]

[project.scripts]
collector = "collector.cli:app"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "collector"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["collector/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
